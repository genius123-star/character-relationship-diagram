<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>人物关系图谱</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f1e9; }
    iframe { width: 100%; height: 100%; border: 0; }
    #status { position: fixed; z-index: 2; right: 16px; bottom: 16px; left: 16px; display: none; padding: 12px 14px; color: #8a3a34; background: #fff1ef; border: 1px solid #efc4bf; border-radius: 10px; font: 14px/1.5 system-ui, sans-serif; box-shadow: 0 8px 24px rgb(40 32 28 / 14%); }
  </style>
</head>
<body>
  <!-- 侧边栏 iframe 嵌入网页端应用（同一 URL → 同一 origin IndexedDB，数据与网页端天然共享）。
       开发期指向本地 dev server；生产改为部署地址。 -->
  <iframe id="app" src="http://127.0.0.1:5173/?from=extension" allow="clipboard-read; clipboard-write"></iframe>
  <div id="status" role="status"></div>
  <script type="module" src="./bridge.mjs"></script>
</body>
</html>
